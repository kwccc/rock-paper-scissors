<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="top">
    <button id="newGame">New Game</button>
  </div>
  <div class="options">
    <div class="left-option"></div>
    <div>
      <button class="buttons">Rock</button>
      <button class="buttons">Paper</button>
      <button class="buttons">Scissors</button>
    </div>
    <div class="right-option"></div>
  </div>
  <div class="results">
    <div class="wins">
      Wins
      <div class="winCounter">0</div>
    </div>
    <div class="draws">
      Draws
      <div class="drawCounter">0</div>
    </div>
    <div class="losses">
      Losses
      <div class="lossCounter">0</div>
    </div>
  </div>
  <div class="message"></div>
</body>
</html>
